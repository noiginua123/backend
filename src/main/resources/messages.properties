# ER001: Chưa nhập trường bắt buộc - Hãy nhập [Tên hạng mục].
# Tham số: {0} = Tên hạng mục
ER001=「{0}」を入力してください。

# ER002: Chưa chọn trường bắt buộc - Hãy nhập [Tên hạng mục].
# Tham số: {0} = Tên hạng mục
ER002=「{0}」を入力してください。

# ER003: Dữ liệu đã tồn tại trong hệ thống - [Tên hạng mục] đã tồn tại.
# Tham số: {0} = Tên hạng mục
ER003=「{0}」は既に存在しています。

# ER004: Dữ liệu không tồn tại trong hệ thống - [Tên hạng mục] không tồn tại.
# Tham số: {0} = Tên hạng mục
ER004=「{0}」は存在していません。

# ER005: Sai định dạng dữ liệu - Hãy nhập [Tên hạng mục] đúng định dạng xxx.
# Tham số: {0} = Tên hạng mục, {1} = Định dạng yêu cầu (ví dụ: yyyy/MM/dd)
ER005=「{0}」を{1}形式で入力してください。

# ER006: Vượt quá độ dài tối đa cho phép - [Tên hạng mục] không được vượt quá xxxx ký tự.
# Tham số: {0} = Số ký tự tối đa, {1} = Tên hạng mục
ER006={0}桁以内の「{1}」を入力してください。

# ER007: Độ dài ký tự nằm ngoài khoảng quy định - [Tên hạng mục] phải >= xxx và <= xxx ký tự.
# Tham số: {0} = Tên hạng mục, {1} = Độ dài tối thiểu, {2} = Độ dài tối đa
ER007=「{0}」を{1}＜＝桁数、＜＝{2}桁で入力してください。

# ER008: Chỉ chấp nhận ký tự 1 byte (bán giác) - [Tên hạng mục] chỉ chấp nhận ký tự 1 byte.
# Tham số: {0} = Tên hạng mục
ER008=「{0}」に半角英数を入力してください。

# ER009: Kiểm tra định dạng Kana - [Tên hạng mục] phải là ký tự kana.
# Tham số: {0} = Tên hạng mục
ER009=「{0}」をカタカナで入力してください。

# ER010: Kiểm tra định dạng Hiragana - [Tên hạng mục] phải là ký tự hiragana.
# Tham số: {0} = Tên hạng mục
ER010=「{0}」をひらがなで入力してください。

# ER011: Ngày tháng không hợp lệ - [Tên hạng mục] không hợp lệ.
# Tham số: {0} = Tên hạng mục
ER011=「{0}」は無効になっています。

# ER012: Ngày hết hạn nhỏ hơn ngày cấp chứng chỉ - [Ngày hết hạn] phải lớn hơn [Ngày cấp chứng chỉ].
ER012=「失効日」は「資格交付日」より未来の日で入力してください。

# ER013: Chỉnh sửa người dùng không tồn tại - User không tồn tại.
ER013=該当するユーザは存在していません。

# ER014: Xóa người dùng không tồn tại - User không tồn tại.
ER014=該当するユーザは存在していません。

# ER015: Lỗi thao tác cơ sở dữ liệu (Database Error) - Hệ thống đang có lỗi.
ER015=システムエラーが発生しました。

# ER016: Sai thông tin đăng nhập - [Tên đăng nhập] hoặc [Mật khẩu] bị sai.
ER016=「アカウント名」または「パスワード」は不正です。

# ER017: Mật khẩu xác nhận không trùng khớp - [Mật khẩu xác nhận] không đúng.
ER017=「パスワード（確認）」が不正です。

# ER018: Bắt buộc là số halfsize (nửa độ rộng) - [Tên hạng mục] phải là số halfsize.
# Tham số: {0} = Tên hạng mục
ER018={0}は半角数字で入力してください。

# ER019: Sai định dạng tên đăng nhập - [Tên đăng nhập] chỉ chấp nhận (a-z, A-Z, 0-9, _); ký tự đầu không phải số.
ER019=[アカウント名]は(a-z, A-Z, 0-9 と _)の桁のみです。最初の桁は数字ではない。

# ER020: Kiểm tra tài khoản quản trị viên (Admin) - Không thể xóa user admin.
ER020=管理者ユーザを削除することはできません。

# ER021: Thứ tự sắp xếp không hợp lệ - Thứ tự sắp xếp phải là ASC hoặc DESC.
ER021=ソートは (ASC, DESC) でなければなりません。

# ER022: Trang yêu cầu không tồn tại - Page not found.
ER022=ページが見つかりません。

# ER023: Lỗi hệ thống chung (System Error) - Hệ thống đang có lỗi.
ER023=システムエラーが発生しました。

# ==============================================================================
# 2. Danh sách thông báo thông tin / thao tác thành công (MSG001 - MSG005)
# ==============================================================================

# MSG001: Đăng ký người dùng thành công.
MSG001=ユーザの登録が完了しました。

# MSG002: Cập nhật người dùng thành công.
MSG002=ユーザの更新が完了しました。

# MSG003: Xóa người dùng thành công.
MSG003=ユーザの削除が完了しました。

# MSG004: Xác nhận trước khi thực hiện xóa người dùng.
MSG004=削除しますが、よろしいでしょうか。

# MSG005: Không tìm thấy người dùng phù hợp với điều kiện tìm kiếm.
MSG005=検索条件に該当するユーザが見つかりません。
